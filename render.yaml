services:
  # Single Web Service: Express serves both API and built React frontend
  - type: web
    name: next-door-library
    runtime: node
    region: singapore  # Closest to Nagpur
    plan: free
    rootDir: .
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false   # Set in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set in Render dashboard
      - key: RAZORPAY_KEY_ID
        sync: false   # Your Razorpay Key ID (e.g. rzp_test_TVCByw7UcHjLfe)
      - key: RAZORPAY_KEY_SECRET
        sync: false   # Your Razorpay Secret (e.g. EEbLsoXBkLnK97V7J7KgSFey)
      - key: MAILJET_API_KEY
        sync: false   # Optional: Mailjet API Key
      - key: MAILJET_API_SECRET
        sync: false   # Optional: Mailjet API Secret
      - key: MAILJET_FROM_EMAIL
        value: admin@nextdoorlibrary.in
